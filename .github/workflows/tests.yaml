---
name: Tests

on: # yamllint disable-line rule:truthy
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  unit:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHON_COVERAGE_LIMIT: 90
    permissions:
      contents: read
    steps:
      - name: Checkout The Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Lint
        run: uv run ruff check --output-format=github src/ tests/

      - name: Type-check
        shell: bash
        run: |
          set +e
          uv run mypy src/ > mypy.txt 2>&1
          rc=$?
          while IFS= read -r line; do echo "::error::mypy: ${line}"; done < mypy.txt
          exit $rc

      - name: Run unit tests
        run: make test 2>&1 | tee pytest-coverage.txt

      - name: Read coverage
        id: coverage
        run: |
          COVERAGE=$(awk '/^TOTAL/ {print $(NF)}' pytest-coverage.txt | tr -d '%')
          echo "value=$COVERAGE" >> "$GITHUB_OUTPUT"

      - name: Fail if coverage too low
        if: ${{ fromJSON(steps.coverage.outputs.value) < fromJSON(env.PYTHON_COVERAGE_LIMIT) }}
        run: |
          echo "Coverage is below ${{ env.PYTHON_COVERAGE_LIMIT }}%!"
          exit 1

      - name: Build
        run: make build
