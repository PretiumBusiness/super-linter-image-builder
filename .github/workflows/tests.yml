name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - run: uv run ruff check --output-format=github src/ tests/
      - name: Type-check
        shell: bash
        run: |
          set +e
          uv run mypy src/ > mypy.txt 2>&1
          rc=$?
          while IFS= read -r line; do echo "::error::mypy: ${line}"; done < mypy.txt
          exit $rc
      - run: make test
      - run: make build
