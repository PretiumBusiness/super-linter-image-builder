name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - run: uv run ruff check --output-format=github src/ tests/
      - run: uv run mypy src/ | sed 's/^/::error::/' ; exit ${PIPESTATUS[0]}
        shell: bash
      - run: make test
      - run: make build
