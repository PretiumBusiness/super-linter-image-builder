---
name: Profiles benchmark

# For each stack profile: generate a lean image from its VALIDATE_* flags,
# push it (gzip and zstd layers) to GHCR, verify every tool runs, then measure
# cold and warm pulls against the upstream baseline image.
#
# Runs on the self-hosted runner by default. Needs on that runner: docker with
# buildx, python3, jq, curl, git.

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: Upstream Super-Linter release tag
        default: v9.0.0
        required: true
      profiles:
        description: Comma-separated profile names, or "all"
        default: all
        required: true
      runs:
        description: Pulls per image and mode
        default: "3"
        required: true
      runner_labels:
        description: JSON array of runner labels
        default: '["self-hosted", "pretium"]'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  plan:
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        env:
          PROFILES: ${{ inputs.profiles }}
        run: |
          all="ghwm python java dotnet rust c-cpp frontend-vanilla frontend-react frontend-vue frontend-angular frontend-svelte"
          if [ "$PROFILES" = "all" ]; then list="$all"; else list="${PROFILES//,/ }"; fi
          json="$(
            for p in $list; do
              test -f "profiles/$p.env" || { echo "::error::unknown profile $p" >&2; exit 1; }
              envs="profiles/common.env profiles/$p.env"
              [ "$p" = "ghwm" ] && envs="profiles/ghwm.env"
              jq -nc --arg p "$p" --arg e "$envs" '{profile: $p, envs: $e}'
            done | jq -sc .
          )"
          echo "matrix=$json" >> "$GITHUB_OUTPUT"

  profile:
    name: ${{ matrix.profile }}
    needs: plan
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    strategy:
      fail-fast: false
      # One at a time: the benchmark must not compete with itself for the
      # network and disk of a single runner.
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PROFILE: ${{ matrix.profile }}
      ENVS: ${{ matrix.envs }}
      TAG: ${{ inputs.upstream_tag }}
      RUNS: ${{ inputs.runs }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: super-linter/super-linter
          ref: ${{ inputs.upstream_tag }}
          path: upstream
          sparse-checkout: Dockerfile
          sparse-checkout-cone-mode: false

      - name: Generate build context
        run: |
          args=()
          for e in $ENVS; do args+=(--env "$e"); done
          python3 compiler/generate.py "${args[@]}" \
            --upstream-tag "$TAG" --upstream-dockerfile upstream/Dockerfile --out build
          {
            echo "BASELINE_IMAGE=$(jq -r .baseline_image build/plan.json)"
            echo "LEAN_BASE=ghcr.io/${GITHUB_REPOSITORY,,}/lean-${PROFILE}"
          } >> "$GITHUB_ENV"
          {
            echo "### ${PROFILE}"
            echo "Baseline: \`$(jq -r .baseline_image build/plan.json)\`"
            echo
            echo "npm packages kept (roots): $(jq -r '.npm_roots | length' build/plan.json)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push (gzip and zstd layers)
        run: |
          for c in gzip zstd; do
            docker buildx build build \
              --provenance=false --sbom=false \
              --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              --label "io.pretium.upstream-tag=${TAG}" \
              --label "io.pretium.profile=${PROFILE}" \
              --output "type=image,name=${LEAN_BASE}:${TAG}-${c},push=true,oci-mediatypes=true,compression=${c},force-compression=true"
          done

      # Optional: enables the download vs unpack split. Failure is tolerated.
      - name: Install crane
        continue-on-error: true
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_x86_64.tar.gz \
            | tar -xz -C "$HOME/.local/bin" crane
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify every tool runs in the lean image
        run: |
          docker pull --quiet "${LEAN_BASE}:${TAG}-gzip" >/dev/null
          docker run --rm -v "$PWD/build/checks.sh:/checks.sh:ro" --entrypoint bash \
            "${LEAN_BASE}:${TAG}-gzip" /checks.sh | tee checks.log

      - name: Benchmark pulls
        if: always()
        run: |
          out="bench-${PROFILE}.jsonl"
          rm -f "$out"
          export BENCH_OUT="$out"
          measure() { # image kind mode
            BENCH_MODE="$3" scripts/bench-pull.sh "$1" "$RUNS" "${PROFILE}/$2" self-hosted \
              || echo "::warning::benchmark failed: $2 ($3)"
          }
          for mode in cold warm; do
            measure "$BASELINE_IMAGE" baseline "$mode"
            measure "${LEAN_BASE}:${TAG}-gzip" lean-gzip "$mode"
            measure "${LEAN_BASE}:${TAG}-zstd" lean-zstd "$mode"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-${{ matrix.profile }}
          path: |
            bench-${{ matrix.profile }}.jsonl
            build/plan.json
            build/Dockerfile
            checks.log

      - name: Free disk
        if: always()
        run: |
          docker image rm -f "${LEAN_BASE}:${TAG}-gzip" "${LEAN_BASE}:${TAG}-zstd" >/dev/null 2>&1 || true
          docker image prune -f >/dev/null 2>&1 || true

  summary:
    needs: profile
    if: always()
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: profile-*
          merge-multiple: true
      - name: Compare lean against baseline
        run: |
          {
            echo "## Lean vs upstream baseline (upstream ${{ inputs.upstream_tag }})"
            echo
            scripts/compare.sh bench-*.jsonl
          } | tee results.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            results.md
            bench-*.jsonl
