---
name: Upstream sync

# Keeps src/superlint_lean/data/linters.json in step with upstream Super-Linter.
#
# Nothing here does work on upstream's behalf unless upstream has a newer
# release than the one pinned in upstream-version.txt:
#
#   detect    scheduled and manual runs: one GitHub API call that compares the
#             pinned version with the latest upstream release. Nothing else runs
#             when the pin is current.
#   sync      only when upstream is ahead: add the linters that are missing from
#             the mapping (draft entries), build one image containing every
#             mapped linter to check them, bump the pin and open a pull request.
#             Merging that pull request starts the release workflow, which runs
#             the before/after benchmarks.
#   coverage  push and pull request only (a check on our own changes): the
#             mapping must cover every flag of the pinned upstream version.
#
# detect and coverage run on GitHub-hosted runners (coverage also runs for pull
# requests, which must never run on the self-hosted runner). sync needs docker
# with buildx, uv (installed by the workflow), jq, git and gh (a GitHub-hosted runner has them all).
# Opening the pull request needs the repository setting "Allow GitHub Actions to
# create and approve pull requests". Without it the branch is still pushed.

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      force_tag:
        description: Sync to this upstream tag even if it is not the latest (optional)
        required: false
        default: ""
      runner_labels:
        description: JSON array of runner labels for the sync job (default - the RUNNER_LABELS repository variable, else ubuntu-latest)
        default: ""
        required: false
  pull_request:
    paths:
      - src/**
      - pyproject.toml
      - upstream-version.txt
      - .github/workflows/upstream-sync.yml
  push:
    branches: [main]
    paths:
      - src/**
      - upstream-version.txt

permissions:
  contents: write
  pull-requests: write
  packages: read

concurrency:
  group: upstream-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage:
    name: Mapping covers the pinned upstream version
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - id: pin
        run: echo "pinned=$(tr -d '[:space:]' < upstream-version.txt)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: super-linter/super-linter
          ref: ${{ steps.pin.outputs.pinned }}
          path: upstream
          persist-credentials: false
          sparse-checkout: |
            lib
            dependencies

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Compare the mapping with upstream
        run: |
          set +e
          uv run superlint-lean sync-mapping --upstream upstream --report coverage.md
          rc=$?
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            echo "::error::src/superlint_lean/data/linters.json does not match upstream ${{ steps.pin.outputs.pinned }}. See the job summary."
            exit 1
          fi

  detect:
    name: Is upstream ahead of the pinned version?
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      pinned: ${{ steps.v.outputs.pinned }}
      latest: ${{ steps.v.outputs.latest }}
      behind: ${{ steps.v.outputs.behind }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: upstream-version.txt
          sparse-checkout-cone-mode: false

      - id: v
        env:
          FORCE_TAG: ${{ inputs.force_tag }}
        run: |
          pinned="$(tr -d '[:space:]' < upstream-version.txt)"
          latest="$FORCE_TAG"
          if [ -z "$latest" ]; then
            latest="$(gh api repos/super-linter/super-linter/releases/latest --jq .tag_name)"
          fi
          newest="$(printf '%s\n%s\n' "$pinned" "$latest" | sort -V | tail -1)"
          if [ "$latest" != "$pinned" ] && [ "$newest" = "$latest" ]; then
            behind=true
            echo "Pinned $pinned is behind upstream $latest. Running the sync." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            behind=false
            echo "Pinned $pinned is current (upstream $latest). Nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "pinned=$pinned"
            echo "latest=$latest"
            echo "behind=$behind"
          } >> "$GITHUB_OUTPUT"

  sync:
    name: Sync to a newer upstream release
    needs: detect
    if: needs.detect.outputs.behind == 'true'
    runs-on: ${{ fromJSON(inputs.runner_labels || vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PINNED: ${{ needs.detect.outputs.pinned }}
      TAG: ${{ needs.detect.outputs.latest }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out the new upstream release
        uses: actions/checkout@v4
        with:
          repository: super-linter/super-linter
          ref: ${{ needs.detect.outputs.latest }}
          path: upstream
          persist-credentials: false
          sparse-checkout: |
            lib
            dependencies

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Add missing linters to the mapping
        run: |
          set +e
          uv run superlint-lean sync-mapping --upstream upstream --write --report sync-report.md
          cat sync-report.md >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Build an image with every mapped linter and run the tool checks
        continue-on-error: true
        run: |
          docker system prune -af >/dev/null 2>&1 || true
          uv run superlint-lean generate --all --upstream-tag "$TAG" \
            --upstream-dockerfile upstream/Dockerfile --out build-all
          docker buildx build build-all --provenance=false --sbom=false --load -t lean-all:check
          docker run --rm -v "$PWD/build-all/checks.sh:/checks.sh:ro" --entrypoint bash \
            lean-all:check /checks.sh 2>&1 | tee checks-all.log

      - name: Open a pull request
        run: |
          echo "$TAG" > upstream-version.txt
          branch="sync/upstream-${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -B "$branch"
          git add upstream-version.txt src/superlint_lean/data/linters.json
          git commit -q -m "Sync mapping with upstream ${TAG}"
          git push -f origin "$branch"
          {
            echo "Syncs the mapping with upstream Super-Linter ${TAG} (was ${PINNED})."
            echo
            echo "Merging this pull request starts the release workflow: it benchmarks the new version and publishes release notes with the before and after numbers."
            echo
            cat sync-report.md
            echo
            echo "### Tool checks on an image with every mapped linter"
            echo
            if [ -f checks-all.log ]; then
              echo "Failed: $(grep -c '^FAIL' checks-all.log || true)"
              echo '```'
              grep -E '^(FAIL|    )' checks-all.log | head -60 || true
              echo '```'
            else
              echo "The image did not build. See the workflow run."
            fi
            echo
            echo "Draft entries are verified only by their tool check. Review them before merging."
          } > pr-body.md
          gh pr create --base main --head "$branch" \
            --title "Sync mapping with upstream ${TAG}" --body-file pr-body.md \
            || echo "::warning::could not open a pull request. The branch $branch was pushed."
