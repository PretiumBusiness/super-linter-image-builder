---
name: Publish Super-Linter image

# Builds this repository's own lean Super-Linter image from
# .github/super-linter.env with superlint-lean and pushes it to GHCR. The
# super-linter workflow can run it through SUPER_LINTER_IMAGE.
#
#   ghcr.io/<owner>/<repo>/lint:latest                      moves with each rebuild
#   ghcr.io/<owner>/<repo>/lint:<upstream tag>              moves with each rebuild of that version
#   ghcr.io/<owner>/<repo>/lint:<upstream tag>-<short sha>  immutable
#
# Optionally it points the SUPER_LINTER_IMAGE repository variable (read by the
# super-linter workflow) at the immutable tag it just pushed. Writing a
# repository variable needs more than the workflow token, so this only happens
# when the VARIABLES_TOKEN secret exists (a token allowed to write Actions
# variables). Without it, set the variable once to the stable tag
# (ghcr.io/<owner>/<repo>/lint:latest) and every rebuild, including a new
# upstream version, is picked up.
#
# It runs when the linter flags, the upstream pin or the generator change on
# main, or by hand. It never runs on a schedule: a new upstream release arrives
# through upstream-version.txt.

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
    paths:
      - .github/super-linter.env
      - upstream-version.txt
      - src/superlint_lean/**
      - .github/workflows/self-image.yaml
  workflow_dispatch:

permissions: {}

concurrency:
  group: self-image
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout the source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned upstream version
        id: pin
        run: echo "tag=$(tr -d '[:space:]' < upstream-version.txt)" >> "$GITHUB_OUTPUT"

      - name: Checkout the upstream Dockerfile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: super-linter/super-linter
          ref: ${{ steps.pin.outputs.tag }}
          path: upstream
          sparse-checkout: Dockerfile
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Generate the build context
        env:
          TAG: ${{ steps.pin.outputs.tag }}
        run: |
          uv run superlint-lean generate --env .github/super-linter.env \
            --upstream-tag "${TAG}" --upstream-dockerfile upstream/Dockerfile --out build
          jq -r '"Flags: " + (.flags | join(" "))' build/plan.json >> "${GITHUB_STEP_SUMMARY}"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push
        id: build
        env:
          TAG: ${{ steps.pin.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          image="ghcr.io/${REPOSITORY,,}/lint"
          docker buildx build build \
            --provenance=false --sbom=false \
            --build-arg "BUILD_REVISION=${SHA}" \
            --build-arg "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${REPOSITORY}" \
            --label "io.superlint-lean.upstream-tag=${TAG}" \
            --tag "${image}:latest" --tag "${image}:${TAG}" --tag "${image}:${TAG}-${SHA::7}" \
            --push
          echo "Pushed \`${image}:${TAG}-${SHA::7}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "image=${image}:${TAG}-${SHA::7}" >> "${GITHUB_OUTPUT}"

      - name: Point SUPER_LINTER_IMAGE at the new image
        env:
          GH_TOKEN: ${{ secrets.VARIABLES_TOKEN }}
          GH_REPO: ${{ github.repository }}
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "VARIABLES_TOKEN is not set; leaving SUPER_LINTER_IMAGE as it is." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          gh variable set SUPER_LINTER_IMAGE --body "${IMAGE}"
          echo "SUPER_LINTER_IMAGE is now \`${IMAGE}\`" >> "${GITHUB_STEP_SUMMARY}"
