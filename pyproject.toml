[project]
name = "superlint-lean"
dynamic = ["version"]
description = "Generate lean, pinned Super-Linter images from VALIDATE_* flags."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]
authors = [{ name = "Peter Meyer Elphick Frandsen" }]
keywords = ["super-linter", "github-actions", "docker", "ci-cd", "linting"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
]

[dependency-groups]
test = ["pytest>=8.0", "pytest-cov>=6.0"]
lint = ["ruff>=0.4"]
typecheck = ["mypy>=1.10", "types-PyYAML>=6.0"]
build = ["build>=1.0"]
dev = [
  { include-group = "test" },
  { include-group = "lint" },
  { include-group = "typecheck" },
  { include-group = "build" },
]

[tool.uv]
default-groups = ["dev"]
exclude-newer = "7 days"

[project.scripts]
superlint-lean = "superlint_lean.cli:main"

[project.urls]
Homepage = "https://github.com/PretiumBusiness/super-linter-image-builder"
Repository = "https://github.com/PretiumBusiness/super-linter-image-builder"
Issues = "https://github.com/PretiumBusiness/super-linter-image-builder/issues"

[build-system]
requires = ["hatch-vcs", "hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
packages = ["src/superlint_lean"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=superlint_lean --cov-report=term-missing"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "RUF", "N"]
# long lines are mostly embedded shell and Dockerfile text
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
